<script>
const SK = 'adv_dsa_v1';
let done = JSON.parse(localStorage.getItem(SK)||'{}');
let curTab = 'all', curFilter = 'all';

function hl(raw){
  let s = raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const saved=[], ph='\x01';
  s = s.replace(/("""[\s\S]*?"""|'''[\s\S]*?'''|"[^"\n]*"|'[^'\n]*')/g,m=>{saved.push('<span class="st">'+m+'</span>');return ph+String(saved.length-1)+ph;});
  s = s.replace(/(#[^\n]*)/g,m=>{saved.push('<span class="cm">'+m+'</span>');return ph+String(saved.length-1)+ph;});
  s = s.replace(/\b(def|class|return|if|elif|else|for|while|in|not|and|or|import|from|as|with|yield|lambda|pass|break|continue|raise|try|except|finally|async|await|None|True|False|self|cls|global|nonlocal|del|assert|is)\b/g,'<span class="kw">$1</span>');
  s = s.replace(/@(\w+)/g,'<span class="dc">@$1</span>');
  s = s.replace(/\b(print|len|range|enumerate|zip|map|filter|sorted|list|dict|set|tuple|str|int|float|bool|type|isinstance|hasattr|getattr|setattr|super|property|staticmethod|classmethod|open|next|iter|sum|min|max|abs|round|any|all|hash|id|input|repr|vars|dir|callable|__init__|__str__|__repr__|__len__|__iter__|__next__|__enter__|__exit__|__new__|__del__|append|extend|pop|remove|get|update|keys|values|items|add|discard|union|intersection)\b/g,'<span class="bi">$1</span>');
  s = s.replace(/\b([A-Z][A-Za-z0-9_]*)\b/g,'<span class="cn">$1</span>');
  s = s.replace(/\b(\d+\.?\d*)\b/g,'<span class="nm">$1</span>');
  s = s.replace(new RegExp(ph+'(\\d+)'+ph,'g'),(_,i)=>saved[+i]);
  return s;
}

const questions = [
// ─── ARRAYS & TWO POINTERS ───
{id:1,cat:'arrays',diff:'hard',title:'Container With Most Water',tags:['Two Pointers','Greedy'],
note:'Two pointer inward shrink — max area problem.',
approaches:[
  {type:'brute',label:'🔴 Brute O(n²)',tc:'TC: O(n²) SC: O(1)',desc:'Har pair try karo, max area track karo.',code:`def max_area_brute(height):
    res = 0
    for i in range(len(height)):
        for j in range(i+1, len(height)):
            res = max(res, min(height[i],height[j])*(j-i))
    return res`},
  {type:'optimal',label:'🟢 Optimal O(n)',tc:'TC: O(n) SC: O(1)',desc:'Left-right pointer. Shorter side ko move karo — area tabhi badh sakta hai.',code:`def max_area(height):
    l, r = 0, len(height) - 1
    res = 0
    while l < r:
        area = min(height[l], height[r]) * (r - l)
        res = max(res, area)
        if height[l] < height[r]:
            l += 1
        else:
            r -= 1
    return res`}
],tip:'Shorter side move karna key insight hai — larger side move karne se area decrease hoga ya same rahega.'},

{id:2,cat:'arrays',diff:'hard',title:'3Sum (Triplets = 0)',tags:['Two Pointers','Sorting'],
note:'Sort + two pointer for each fixed element.',
approaches:[
  {type:'brute',label:'🔴 Brute O(n³)',tc:'TC: O(n³) SC: O(1)',desc:'3 nested loops, all triplets check karo.',code:`def three_sum_brute(nums):
    res = set()
    for i in range(len(nums)):
        for j in range(i+1,len(nums)):
            for k in range(j+1,len(nums)):
                if nums[i]+nums[j]+nums[k]==0:
                    res.add(tuple(sorted([nums[i],nums[j],nums[k]])))
    return list(res)`},
  {type:'optimal',label:'🟢 Optimal O(n²)',tc:'TC: O(n²) SC: O(1)',desc:'Sort kar, phir har element pe two pointer.',code:`def three_sum(nums):
    nums.sort()
    res = []
    for i, n in enumerate(nums):
        if i > 0 and nums[i] == nums[i-1]:  # skip dups
            continue
        l, r = i + 1, len(nums) - 1
        while l < r:
            s = n + nums[l] + nums[r]
            if s > 0: r -= 1
            elif s < 0: l += 1
            else:
                res.append([n, nums[l], nums[r]])
                l += 1
                while l < r and nums[l] == nums[l-1]:
                    l += 1
    return res`}
],tip:'Duplicate skip karna mat bhulna — sorted array mein easy hai.'},

{id:3,cat:'arrays',diff:'hard',title:'Trapping Rain Water',tags:['Two Pointers','DP'],
note:'Classic — left_max/right_max per index.',
approaches:[
  {type:'brute',label:'🔴 Brute O(n²)',tc:'TC: O(n²) SC: O(1)',desc:'Har position pe left_max aur right_max scan karo.',code:`def trap_brute(height):
    res = 0
    for i in range(len(height)):
        l_max = max(height[:i+1])
        r_max = max(height[i:])
        res += min(l_max, r_max) - height[i]
    return res`},
  {type:'better',label:'🟡 DP O(n)',tc:'TC: O(n) SC: O(n)',desc:'Precompute left_max[] aur right_max[] arrays.',code:`def trap_dp(height):
    n = len(height)
    lm = [0]*n; rm = [0]*n
    lm[0] = height[0]; rm[-1] = height[-1]
    for i in range(1,n): lm[i] = max(lm[i-1],height[i])
    for i in range(n-2,-1,-1): rm[i] = max(rm[i+1],height[i])
    return sum(min(lm[i],rm[i])-height[i] for i in range(n))`},
  {type:'optimal',label:'🟢 Two Pointer O(1) space',tc:'TC: O(n) SC: O(1)',desc:'L-R pointer, track running max — O(1) space.',code:`def trap(height):
    l, r = 0, len(height)-1
    lm = rm = res = 0
    while l < r:
        if height[l] <= height[r]:
            if height[l] >= lm: lm = height[l]
            else: res += lm - height[l]
            l += 1
        else:
            if height[r] >= rm: rm = height[r]
            else: res += rm - height[r]
            r -= 1
    return res`}
],tip:'Water = min(left_max, right_max) - height[i]. Two pointer ye same kaam O(1) space mein karta hai.'},

// ─── SLIDING WINDOW ───
{id:4,cat:'sliding',diff:'medium',title:'Longest Substring Without Repeating Chars',tags:['Sliding Window','HashMap'],
note:'Expand right, shrink left when duplicate found.',
approaches:[
  {type:'brute',label:'🔴 Brute O(n²)',tc:'TC: O(n²) SC: O(n)',desc:'Har substring check karo for uniqueness.',code:`def length_of_longest_substring_brute(s):
    res = 0
    for i in range(len(s)):
        seen = set()
        for j in range(i, len(s)):
            if s[j] in seen: break
            seen.add(s[j]); res = max(res, j-i+1)
    return res`},
  {type:'optimal',label:'🟢 Sliding Window O(n)',tc:'TC: O(n) SC: O(n)',desc:'char→last_index map, l pointer jump karo.',code:`def length_of_longest_substring(s):
    char_idx = {}
    l = res = 0
    for r, ch in enumerate(s):
        if ch in char_idx and char_idx[ch] >= l:
            l = char_idx[ch] + 1
        char_idx[ch] = r
        res = max(res, r - l + 1)
    return res`}
],tip:'Map mein last seen index store karo, direct jump karo duplicate pe.'},

{id:5,cat:'sliding',diff:'medium',title:'Max Consecutive Ones III (K flips)',tags:['Sliding Window'],
note:'Window with at most K zeros allowed.',
approaches:[
  {type:'optimal',label:'🟢 Sliding Window O(n)',tc:'TC: O(n) SC: O(1)',desc:'Zeros counter rakh, exceed hone pe l shrink karo.',code:`def longest_ones(nums, k):
    l = zeros = res = 0
    for r in range(len(nums)):
        if nums[r] == 0:
            zeros += 1
        while zeros > k:
            if nums[l] == 0: zeros -= 1
            l += 1
        res = max(res, r - l + 1)
    return res`}
],tip:'At most K wale problems mein window shrink karo jab condition violate ho.'},

{id:6,cat:'sliding',diff:'hard',title:'Minimum Window Substring ✅',tags:['Sliding Window','HashMap'],
note:'Already in Python 75 (Q39) — for reference.',
approaches:[
  {type:'optimal',label:'🟢 Sliding Window O(n)',tc:'TC: O(n) SC: O(n)',desc:'Need dict + have dict, formed counter ke saath expand/shrink.',code:`from collections import Counter

def min_window(s, t):
    need = Counter(t); have = {}
    formed = 0; required = len(need)
    l = 0; res = ""; res_len = float('inf')
    for r, ch in enumerate(s):
        have[ch] = have.get(ch, 0) + 1
        if ch in need and have[ch] == need[ch]:
            formed += 1
        while formed == required:
            if r - l + 1 < res_len:
                res_len = r - l + 1; res = s[l:r+1]
            if have[s[l]] == 1: del have[s[l]]
            else: have[s[l]] -= 1
            if s[l] in need and have.get(s[l],0) < need[s[l]]:
                formed -= 1
            l += 1
    return res`}
],tip:'Two dict + formed count — classic. Ye already Python 75 mein hai.'},

// ─── PREFIX SUM ───
{id:7,cat:'prefix',diff:'medium',title:'Subarray Sum Equals K',tags:['Prefix Sum','HashMap'],
note:'prefix_sum - k seen before? HashMap with counts.',
approaches:[
  {type:'brute',label:'🔴 Brute O(n²)',tc:'TC: O(n²) SC: O(1)',desc:'Har subarray ka sum compute karo.',code:`def subarray_sum_brute(nums, k):
    count = 0
    for i in range(len(nums)):
        s = 0
        for j in range(i, len(nums)):
            s += nums[j]
            if s == k: count += 1
    return count`},
  {type:'optimal',label:'🟢 Prefix Sum + HashMap O(n)',tc:'TC: O(n) SC: O(n)',desc:'prefix_sum[i] - prefix_sum[j] = k → prefix_sum[j] = prefix_sum[i] - k. Map mein count store karo.',code:`from collections import defaultdict

def subarray_sum(nums, k):
    count = 0
    prefix = 0
    seen = defaultdict(int)
    seen[0] = 1  # empty prefix
    for n in nums:
        prefix += n
        count += seen[prefix - k]
        seen[prefix] += 1
    return count`}
],tip:'seen[0]=1 initialize karna mat bhulna — subarray starting from index 0 handle karta hai.'},

{id:8,cat:'prefix',diff:'easy',title:'Range Sum Query (Immutable)',tags:['Prefix Sum'],
note:'Precompute prefix, then O(1) query.',
approaches:[
  {type:'optimal',label:'🟢 Prefix Array O(1) query',tc:'Build: O(n) Query: O(1)',desc:'prefix[i] = sum(nums[0..i-1]), then range = prefix[r+1]-prefix[l].',code:`class NumArray:
    def __init__(self, nums):
        self.prefix = [0] * (len(nums) + 1)
        for i, n in enumerate(nums):
            self.prefix[i+1] = self.prefix[i] + n

    def sumRange(self, left, right):
        return self.prefix[right+1] - self.prefix[left]

# Usage
na = NumArray([-2, 0, 3, -5, 2, -1])
print(na.sumRange(0, 2))  # 1
print(na.sumRange(2, 5))  # -1`}
],tip:'Backend mein analytics queries pe prefix sum useful — instead of GROUP BY every time.'},

// ─── HASHING ───
{id:9,cat:'hashing',diff:'medium',title:'Longest Consecutive Sequence',tags:['HashSet','Arrays'],
note:'Set mein daal, start of sequence dhundho.',
approaches:[
  {type:'brute',label:'🔴 Brute O(n²)',tc:'TC: O(n²) SC: O(1)',desc:'Har number se consecutive check karo.',code:`def longest_consecutive_brute(nums):
    res = 0
    for n in nums:
        length = 1
        while n + length in nums:
            length += 1
        res = max(res, length)
    return res`},
  {type:'optimal',label:'🟢 HashSet O(n)',tc:'TC: O(n) SC: O(n)',desc:'Sirf sequence start (n-1 not in set) se count karo.',code:`def longest_consecutive(nums):
    num_set = set(nums)
    res = 0
    for n in num_set:
        if n - 1 not in num_set:  # start of sequence
            length = 1
            while n + length in num_set:
                length += 1
            res = max(res, length)
    return res`}
],tip:'Key insight: n-1 not in set → sequence ka start hai. Set lookup O(1) hai.'},

{id:10,cat:'hashing',diff:'medium',title:'Group Anagrams ✅',tags:['HashMap','Sorting'],
note:'Already in Python 75 (Q37) — sorted key.',
approaches:[
  {type:'optimal',label:'🟢 Sort Key O(n·k log k)',tc:'TC: O(n·k·log k) SC: O(n)',desc:'sorted(word) ko key banao, dict mein group karo.',code:`from collections import defaultdict

def group_anagrams(strs):
    groups = defaultdict(list)
    for s in strs:
        key = tuple(sorted(s))
        groups[key].append(s)
    return list(groups.values())

# Faster: 26-char count as key O(n·k)
def group_anagrams_v2(strs):
    groups = defaultdict(list)
    for s in strs:
        key = [0] * 26
        for c in s: key[ord(c)-ord('a')] += 1
        groups[tuple(key)].append(s)
    return list(groups.values())`}
],tip:'Already covered. Count array key = O(k) but constant for small alphabets — faster than sort.'},

// ─── STACK & QUEUE ───
{id:11,cat:'stack',diff:'medium',title:'Next Greater Element (Monotonic Stack)',tags:['Stack','Monotonic'],
note:'Monotonic decreasing stack — pop when greater found.',
approaches:[
  {type:'brute',label:'🔴 Brute O(n²)',tc:'TC: O(n²) SC: O(n)',desc:'Har element ke liye right side scan karo.',code:`def next_greater_brute(nums):
    res = [-1] * len(nums)
    for i in range(len(nums)):
        for j in range(i+1, len(nums)):

                res[i] = nums[j]; break

  {type:'optimal',label:'🟢 Monotonic Stack O(n)',tc:'TC: O(n) SC: O(n)',desc:'Stack mein indices rakh. Jab bada element mile, stack pop karte jao.',code:`def next_greater(nums):
    res = [-1] * len(nums)
    stack = []  # indices, decreasing order of values
    for i, n in enumerate(nums):
        while stack and nums[stack[-1]] < n:
            idx = stack.pop()
            res[idx] = n
        stack.append(i)
    return res

# Circular array variant
def next_greater_circular(nums):
    n = len(nums)
    res = [-1] * n; stack = []
    for i in range(2*n):
        while stack and nums[stack[-1]] < nums[i%n]:
            res[stack.pop()] = nums[i%n]
        if i < n: stack.append(i)
    return res`}

        self.val = val; self.next = next

def reverse_list(head):
    prev = None; curr = head

        nxt = curr.next
        curr.next = prev
        prev = curr

def level_order(root):

    res = []; q = deque([root])

    if root == p or root == q: return root
    left = lowest_common_ancestor(root.left, p, q)

{id:22,cat:'graphs',diff:'medium',title:'Topological Sort (Course Schedule)',tags:['Graph','BFS','DFS','Cycle Detection'],
note:'Kahn\'s algorithm (BFS) ya DFS with states.',
approaches:[
  {type:'optimal',label:'🟢 Kahn\'s BFS O(V+E)',tc:'TC: O(V+E) SC: O(V+E)',desc:'In-degree 0 nodes se start, process karte jao. Cycle hogi to sab nodes process nahi honge.',code:`from collections import defaultdict, deque

def can_finish(numCourses, prerequisites):
    graph = defaultdict(list)
    in_degree = [0] * numCourses
    for a, b in prerequisites:
        graph[b].append(a)
        in_degree[a] += 1
    q = deque(i for i in range(numCourses) if in_degree[i]==0)
    processed = 0
    while q:
        node = q.popleft(); processed += 1
        for nei in graph[node]:
            in_degree[nei] -= 1
            if in_degree[nei] == 0: q.append(nei)
    return processed == numCourses  # False = cycle exists

# Get actual order
def find_order(n, prereqs):
    graph = defaultdict(list); in_deg = [0]*n
    for a,b in prereqs: graph[b].append(a); in_deg[a]+=1
    q = deque(i for i in range(n) if in_deg[i]==0)
    order = []

{id:23,cat:'graphs',diff:'medium',title:'Union Find (Disjoint Set Union)',tags:['Graph','Union Find'],
note:'Connected components, cycle detection in undirected graph.',
approaches:[
  {type:'optimal',label:'🟢 Union Find with Path Compression',tc:'TC: O(α(n)) per op, SC: O(n)',desc:'find() path compress karo, union() rank se merge karo.',code:`class UnionFind:
    def __init__(self, n):
        self.parent = list(range(n))
        self.rank = [0] * n
        self.components = n

    def find(self, x):
        if self.parent[x] != x:
            self.parent[x] = self.find(self.parent[x])  # path compression
        return self.parent[x]

    def union(self, x, y):
        px, py = self.find(x), self.find(y)
        if px == py: return False  # already connected
        if self.rank[px] < self.rank[py]: px, py = py, px
        self.parent[py] = px
        if self.rank[px] == self.rank[py]: self.rank[px] += 1
        self.components -= 1
        return True

# Usage: Number of connected components
def count_components(n, edges):
    uf = UnionFind(n)
    for a, b in edges: uf.union(a, b)
    return uf.components`}
],tip:'Union Find ka use: connected components, kruskal\'s MST, redundant connections. α(n) ≈ O(1) practically.'},

{id:24,cat:'graphs',diff:'hard',title:'Dijkstra\'s Shortest Path',tags:['Graph','Heap','BFS'],
note:'Min-heap priority queue with (dist, node).',
approaches:[
  {type:'optimal',label:'🟢 Dijkstra O((V+E) log V)',tc:'TC: O((V+E)logV) SC: O(V+E)',desc:'Min heap se closest unvisited node process karo.',code:`import heapq
from collections import defaultdict

def dijkstra(n, edges, start):
    graph = defaultdict(list)
    for u, v, w in edges:
        graph[u].append((w, v))
        graph[v].append((w, u))

    dist = [float('inf')] * n
    dist[start] = 0
    heap = [(0, start)]  # (distance, node)

    while heap:
        d, u = heapq.heappop(heap)
        if d > dist[u]: continue  # outdated entry
        for w, v in graph[u]:
            new_dist = dist[u] + w
            if new_dist < dist[v]:
                dist[v] = new_dist
                heapq.heappush(heap, (new_dist, v))
    return dist

# Example
edges = [(0,1,4),(0,2,1),(2,1,2),(1,3,1)]
print(dijkstra(4, edges, 0))  # [0, 3, 1, 4]`}
],tip:'Negative edges pe Bellman-Ford use karo. Dijkstra sirf non-negative weights pe correct hai.'},

{id:30,cat:'dp',diff:'hard',title:'0/1 Knapsack',tags:['DP','Classic'],
note:'Include ya exclude. dp[i][w] = max value with i items and w capacity.',
approaches:[
  {type:'better',label:'🟡 2D DP O(n×W)',tc:'TC: O(n×W) SC: O(n×W)',desc:'Full 2D table: dp[i][w] = max(dp[i-1][w], dp[i-1][w-wt]+val).',code:`def knapsack_2d(weights, values, capacity):
    n = len(weights)
    dp = [[0]*(capacity+1) for _ in range(n+1)]
    for i in range(1, n+1):
        for w in range(capacity+1):
            dp[i][w] = dp[i-1][w]  # exclude
            if weights[i-1] <= w:
                dp[i][w] = max(dp[i][w], dp[i-1][w-weights[i-1]] + values[i-1])

  {type:'optimal',label:'🟢 1D DP O(W) space',tc:'TC: O(n×W) SC: O(W)',desc:'1D array, reverse order mein fill karo (avoid overwrite).',code:`def knapsack(weights, values, capacity):
    dp = [0] * (capacity + 1)
    for i in range(len(weights)):
        for w in range(capacity, weights[i]-1, -1):  # reverse!
            dp[w] = max(dp[w], dp[w-weights[i]] + values[i])
    return dp[capacity]

# Unbounded Knapsack (item multiple times le sako)
def unbounded_knapsack(weights, values, capacity):
    dp = [0] * (capacity + 1)
    for w in range(1, capacity+1):
        for i in range(len(weights)):
            if weights[i] <= w:

class TokenBucket:
    def __init__(self, rate, capacity):
        self.rate = rate        # tokens/sec
        self.capacity = capacity
        self.tokens = capacity

        self.lock = threading.Lock()

def is_allowed(user_id: str, limit: int, window_secs: int) -> bool:
    key = f"rate:{user_id}"

    window_start = now - window_secs

    pipe = r.pipeline()
    pipe.zremrangebyscore(key, 0, window_start)  # remove old
    pipe.zadd(key, {str(now): now})              # add current
    pipe.zcard(key)                               # count in window
    pipe.expire(key, window_secs)

class LRUCache:
    def __init__(self, capacity):
        self.cap = capacity
        self.cache = OrderedDict()

    def get(self, key):
        if key not in self.cache: return -1
        self.cache.move_to_end(key)

  if(curFilter==='pending')qs=qs.filter(q=>!done[q.id]&&!q.covered);
  if(curFilter==='done')qs=qs.filter(q=>done[q.id]);
  if(curFilter==='hard')qs=qs.filter(q=>q.diff==='hard');
  if(curFilter==='medium')qs=qs.filter(q=>q.diff==='medium');
  if(search)qs=qs.filter(q=>q.title.toLowerCase().includes(search)||q.tags.join().toLowerCase().includes(search));

  if(!qs.length){main.innerHTML='<div class="empty">No questions match your filter.</div>';return;}

  const newQs=qs.filter(q=>!q.covered);
  const covQs=qs.filter(q=>q.covered);
  let html='';
  if(newQs.length){
    html+='<div class="grid">'+newQs.map(cardHTML).join('')+'</div>';
  }
  if(covQs.length){
    html+='<div class="section-head">✅ Already Covered in Python 75</div><div class="grid">'+covQs.map(cardHTML).join('')+'</div>';
  }
  main.innerHTML=html;
}

function cardHTML(q){
  const isDone=done[q.id];
  const cls=(q.covered?'covered':isDone?'done':'');
  const tagDiff=q.diff==='hard'?'tag-hard':q.diff==='medium'?'tag-med':'tag-easy';
  const statusTag=q.covered?'<span class="tag tag-covered">✅ Covered</span>':isDone?'<span class="tag tag-done">✓ Done</span>':'';
  const patTags=q.tags.map(t=>`<span class="tag tag-pat">${t}</span>`).join('');
  const check=q.covered?'🔵':isDone?'✅':'⬜';

  let detHTML='';
  if(q.approaches){
    const apHTML=q.approaches.map(a=>`
      <div class="approach ${a.type}">
        <div class="approach-head">${a.label}</div>
        <div class="det-section">${a.desc}</div>
        <div class="tc">${a.tc}</div>
        ${a.code?`<pre>${hl(a.code)}</pre>`:''}
      </div>`).join('');
    detHTML=`
      <button class="det-btn" onclick="toggleDetail(event,${q.id})">Details ▼</button>
      <div class="det-panel" id="det-${q.id}">
        ${apHTML}
        ${q.tip?`<div class="tip-box">${q.tip}</div>`:''}
      </div>`;
  }

  return `<div class="card ${cls}" onclick="toggleDone(${q.id})">
    <div class="c-head">
      <div class="c-num">${q.id.toString().padStart(2,'0')}</div>
      <div class="c-meta">
        <div class="c-title">${q.title}</div>
        <div class="c-tags">
          <span class="tag ${tagDiff}">${q.diff}</span>
          ${patTags}${statusTag}
        </div>
      </div>
      <div class="c-check">${check}</div>
    </div>
    <div class="c-note">${q.note}</div>
    ${detHTML}
  </div>`;
}

function renderResources(){
  const cards=resources.map(r=>`
    <div class="res-card">
      <h3>${r.name}</h3>
      <div class="res-tags">${r.topics.map(t=>`<span class="tag tag-pat">${t}</span>`).join('')}
        <span class="tag tag-med">${r.type}</span></div>
      <p>${r.why}</p>
      <a href="${r.url}" target="_blank" rel="noopener">→ Visit ${r.name}</a>
    </div>`).join('');
  return '<div class="grid">'+cards+'</div>';
}

// Init
updateProgress();renderGrid();
</script>
</body>
</html>
