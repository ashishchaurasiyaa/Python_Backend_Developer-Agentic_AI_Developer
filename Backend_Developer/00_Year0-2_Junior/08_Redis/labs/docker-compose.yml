# Redis lab stack — single instance, no cluster/replication needed for these labs
# Start:  docker compose up -d
# Check:  docker compose exec redis redis-cli ping
# Stop:   docker compose down -v     (-v = data bhi delete, fresh start ke liye)
services:
  redis:
    image: redis:7-alpine
    container_name: redis-lab
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional UI — http://localhost:8081 pe keys/values browse kar sakte ho
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander-lab
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
