"HLD — Fundamentals_Scalability — vertical vs horizontal": {

    if user_id not in _cache:

"HLD — Fundamentals_CAP theorem": {
explain: `CAP = Consistency (har read latest write dekhe), Availability (har request response mile, chahe stale data ho), Partition Tolerance (network split hone pe bhi kaam kare). Distributed system mein network partition inevitable hai — toh real choice C vs A hai. PostgreSQL = CP (consistency choose karta hai). Redis = CP by default. DynamoDB = AP (eventually consistent). Niroskos booking: CP chahiye — double booking acceptable nahi.`,
example: `# ── CP System — PostgreSQL (Consistency Priority) ─
# Network partition ke time: write reject karo, stale read mat do

# Booking creation — strong consistency required
from django.db import transaction

def create_booking(room_id, check_in, check_out, user):
    with transaction.atomic():
        # SELECT FOR UPDATE — other transactions WAIT
        room = Room.objects.select_for_update().get(id=room_id)
        conflict = Booking.objects.filter(
            room=room, status="confirmed",
            check_in__lt=check_out, check_out__gt=check_in
        ).exists()
        if conflict:
            raise RoomNotAvailable()   # fail rather than double book
        return Booking.objects.create(room=room, ...)

# ── AP System — Redis (Availability Priority) ─
# Use case: product view count, session data
# Stale data acceptable

import redis
r = redis.Redis.from_url(settings.REDIS_URL)

def increment_page_views(page_id):
    r.incr(f"views:{page_id}")   # fast, available, might lose count on crash
    # Not critical if count is off by a few — AP is fine here

# ── Choosing C vs A ───────────────────────────
# USE CONSISTENCY (CP) when:
#   - Financial transactions (payment, booking, inventory)
#   - User auth (login tokens must be valid everywhere)
#   - Inventory decrement (can't oversell)

# USE AVAILABILITY (AP) when:
#   - Search results (slightly stale is OK)
#   - Social media likes/views count
#   - Product recommendations
#   - User profile reads (minor staleness acceptable)

# ── Real world — same app uses both ──────────
# PostgreSQL (CP) for bookings, payments
# Redis (CP/AP configurable) for cache, sessions
# Elasticsearch (AP) for search index
# S3 (eventual consistency in old regions) for files`,
tip: `"P in CAP alag kyun nahi choose kar sakte?" — Network partition real-world mein hoti hi hai (cables fail, network congestion). Isliye P is always required — real choice sirf C ya A hai.`
},

"HLD — Fundamentals_ACID vs BASE": {
explain: `ACID (Atomicity, Consistency, Isolation, Durability) = traditional DB guarantees — ya poora transaction hoga ya kuch nahi. BASE (Basically Available, Soft state, Eventually consistent) = distributed systems approach — immediate consistency nahi, par eventually sab sync ho jaata hai. Django ORM ACID follow karta hai (PostgreSQL). Celery tasks BASE follow karte hain — task eventually execute hoga.`,
example: `# ── ACID — Django ORM Transaction ────────────
from django.db import transaction

def transfer_money(from_account_id, to_account_id, amount):
    with transaction.atomic():  # ACID guaranteed
        # A — Atomic: ya dono updates hongi ya koi nahi
        sender   = Account.objects.select_for_update().get(id=from_account_id)
        receiver = Account.objects.select_for_update().get(id=to_account_id)

        # C — Consistent: business rules check
        if sender.balance < amount:
            raise InsufficientFundsError()

        # I — Isolated: other transactions wait (select_for_update)
        sender.balance   -= amount
        receiver.balance += amount
        sender.save(update_fields=["balance"])
        receiver.save(update_fields=["balance"])
        # D — Durable: on commit, written to disk (WAL in PostgreSQL)

# If exception raised anywhere → ROLLBACK automatically
# Both accounts stay consistent

# ── BASE — Celery + Redis (Eventual Consistency) ─
from celery import shared_task

# SAP sync — BASE approach
# Order created immediately in Django (available)
# SAP sync happens asynchronously (eventually consistent)

def create_order(data):
    order = Order.objects.create(**data, sap_synced=False)
    sync_order_to_sap.delay(order.id)   # fire and forget
    return order                         # response immediate

@shared_task(bind=True, max_retries=5, default_retry_delay=60)
def sync_order_to_sap(self, order_id):
    order = Order.objects.get(id=order_id)
    try:
        sap_response = sap_client.create_sales_order(order)
        order.sap_order_id = sap_response["order_id"]
        order.sap_synced   = True
        order.save(update_fields=["sap_order_id", "sap_synced"])
    except SAPConnectionError as exc:
        raise self.retry(exc=exc)   # retry up to 5 times

# System is "basically available" (order works without SAP)
# "Soft state" — sap_synced=False until task runs
# "Eventually consistent" — SAP will have the order...eventually

# ── When to use which ─────────────────────────
# ACID: payments, bookings, inventory decrement, user creation
# BASE: notifications, analytics, SAP sync, feed generation,
#       search index updates, email sending`,
tip: `"Your SAP connector — ACID ya BASE?" — "BASE. Order Django mein ACID se create hota hai. SAP sync Celery task hai — eventually consistent. Agar SAP down hai, task retry hota hai — order creation impact nahi hota."`

"HLD — Fundamentals_Latency vs throughput": {
explain: `Latency = ek request ka response time (milliseconds). Throughput = per second kitni requests handle kar sakte ho (QPS — Queries Per Second). Dono tradeoff mein hote hain — batching se throughput badhta hai par latency badhti hai. P99 latency = 99% requests is time ke andar complete hongi — outliers dikhata hai. Aapne indexing se queries 60% reduce kiye — woh latency improvement tha.`,
example: `# ── Measuring Latency — Django Silk / Custom ─
import time, logging
logger = logging.getLogger(__name__)

class LatencyMiddleware:
    def __init__(self, get_response):
        self.get_response = get_response

    def __call__(self, request):
        start    = time.perf_counter()
        response = self.get_response(request)
        latency  = (time.perf_counter() - start) * 1000  # ms

        logger.info(f"{request.method} {request.path} {latency:.1f}ms "
                    f"status={response.status_code}")

        if latency > 500:   # slow request alert
            logger.warning(f"SLOW REQUEST: {request.path} took {latency:.0f}ms")
        return response

# ── Improving Latency — Database Index ───────

    status     = models.CharField(max_length=20)
    created_at = models.DateTimeField(auto_now_add=True)

    class Meta:
        indexes = [
            models.Index(fields=["user", "status"]),        # composite
            models.Index(fields=["room", "check_in", "status"]),  # composite

# After: index scan = 5ms  →  60% query time reduction

# 8 concurrent workers = 8x throughput for async tasks

# ── QPS Estimation ────────────────────────────
# Niroskos: 50 properties, avg 20 bookings/day each

"HLD — Fundamentals_SLA / SLO / SLI": {
explain: `SLI (Service Level Indicator) = actual measured metric (error rate, latency, uptime). SLO (Service Level Objective) = internal target ("99.9% requests under 200ms"). SLA (Service Level Agreement) = client ke saath contract ("99.9% uptime guarantee — breach pe refund"). SLA >= SLO hona chahiye — SLO breach hone pe SLA breach hone se pehle fix karo. Error budget = kitni downtime allowed hai.`,
example: `# ── SLI Examples ─────────────────────────────
# SLI 1: Availability = successful_requests / total_requests
# SLI 2: Latency = % requests completing under 200ms
# SLI 3: Error Rate = 5xx responses / total responses

# Measure kaise karen:
import time
from prometheus_client import Counter, Histogram

REQUEST_COUNT   = Counter("http_requests_total", "Total requests",
                          ["method", "endpoint", "status"])
REQUEST_LATENCY = Histogram("http_request_duration_seconds",
                            "Request latency", ["endpoint"])

class SLIMiddleware:
    def __init__(self, get_response):
        self.get_response = get_response

    def __call__(self, request):
        start    = time.time()
        response = self.get_response(request)
        latency  = time.time() - start

        REQUEST_COUNT.labels(
            method   = request.method,
            endpoint = request.resolver_match.url_name or "unknown",
            status   = response.status_code,
        ).inc()
        REQUEST_LATENCY.labels(
            endpoint = request.resolver_match.url_name or "unknown"
        ).observe(latency)
        return response

# ── Uptime Calculation ────────────────────────

# Monthly downtime = 30  * 24 * 60 * 0.001 = 43.2 minutes

# Error budget = 43,200 * 0.001 = 43.2 minutes/month
# Downtime so far this month = 10 minutes
# Remaining budget = 33.2 minutes

"HLD — Infrastructure_Load balancing": {
explain: `Load balancer incoming traffic ko multiple servers mein distribute karta hai. Algorithms: Round Robin (ek-ek karke), Least Connections (sabse kam busy server), IP Hash (same client hamesha same server — sticky sessions), Weighted (powerful servers ko zyada traffic). AWS ALB Layer 7 (HTTP) pe kaam karta hai — path-based routing, health checks, SSL termination. NLB Layer 4 (TCP) pe — ultra-low latency.`,
example: `# ── What Load Balancer Does (AWS ALB) ────────
# Client → ALB → [EC2-1, EC2-2, EC2-3]
# ALB health check: every 30s hit /health/

# ── Consistent Hashing (for Cache LB) ─────────
# Problem: 3 cache servers, user_id % 3 for routing
# Add 4th server → 75% keys remapped → cache miss storm!

# Solution: Consistent Hashing ring
import hashlib

class ConsistentHashRing:
    def __init__(self, nodes: list, replicas: int = 100):
        self.replicas = replicas
        self.ring     = {}
        self.sorted_keys = []
        for node in nodes:
            self.add_node(node)

    def add_node(self, node: str):
        for i in range(self.replicas):
            key = self._hash(f"{node}:{i}")
            self.ring[key] = node
            self.sorted_keys.append(key)
        self.sorted_keys.sort()

    def remove_node(self, node: str):
        for i in range(self.replicas):
            key = self._hash(f"{node}:{i}")
            del self.ring[key]
            self.sorted_keys.remove(key)

    def get_node(self, key: str) -> str:
        h = self._hash(key)
        for ring_key in self.sorted_keys:
            if h <= ring_key:
                return self.ring[ring_key]
        return self.ring[self.sorted_keys[0]]  # wrap around

    def _hash(self, s: str) -> int:
        return int(hashlib.md5(s.encode()).hexdigest(), 16)

# 4th node add karo → only ~25% keys remapped (not 75%!)
ring = ConsistentHashRing(["redis-1", "redis-2", "redis-3"])
node = ring.get_node("user_123")   # consistently maps to same node`,

"HLD — Infrastructure_Caching strategies": {
explain: `Cache = fast storage (Redis/Memcached) jo slow storage (DB) ka frequent data store karta hai. Strategies: Cache-Aside (app checks cache first, miss pe DB se laake cache mein store — most common), Write-Through (write cache aur DB simultaneously), Write-Back/Behind (sirf cache mein write, async DB update). Invalidation: TTL-based ya explicit delete on update. Aapne Redis already use kiya hai — is experience se explain karo.`,
example: `import json, redis
from django.core.cache import cache
from functools import wraps

r = redis.Redis.from_url(settings.REDIS_URL, decode_responses=True)

# ── Cache-Aside (most common) ─────────────────
def get_room(room_id: int):
    key  = f"room:{room_id}"
    data = r.get(key)
    if data:
        return json.loads(data)           # cache HIT

    room = Room.objects.select_related("property").get(id=room_id)
    serialized = RoomSerializer(room).data
    r.setex(key, 300, json.dumps(serialized))  # cache for 5 min
    return serialized                      # cache MISS

def update_room(room_id: int, data: dict):
    room = Room.objects.get(id=room_id)
    for k, v in data.items():
        setattr(room, k, v)
    room.save()
    r.delete(f"room:{room_id}")           # INVALIDATE cache on update

# ── Write-Through ─────────────────────────────
def update_user_profile(user_id: int, data: dict):
    # Write to DB AND cache simultaneously
    profile = UserProfile.objects.get(user_id=user_id)
    profile.__dict__.update(data)
    profile.save()
    # Immediately update cache — no stale reads
    cache.set(f"profile:{user_id}", data, timeout=600)

# ── Cache Decorator ────────────────────────────
def cached(key_fn, ttl: int = 300):
    def decorator(func):
        @wraps(func)
        def wrapper(*args, **kwargs):
            key  = key_fn(*args, **kwargs)
            data = r.get(key)
            if data: return json.loads(data)
            result = func(*args, **kwargs)
            r.setex(key, ttl, json.dumps(result))
            return result
        return wrapper
    return decorator

@cached(key_fn=lambda room_id, date: f"availability:{room_id}:{date}", ttl=60)
def check_availability(room_id: int, date: str) -> bool:
    return not Booking.objects.filter(
        room_id=room_id, status="confirmed",
        check_in__lte=date, check_out__gt=date
    ).exists()

# ── Cache Stampede Prevention ─────────────────
# Problem: cache expires, 1000 requests hit DB simultaneously
# Solution: Lock + early recompute

import threading
_locks = {}

def get_with_lock(key: str, compute_fn, ttl: int):
    data = r.get(key)
    if data: return json.loads(data)

    lock = _locks.setdefault(key, threading.Lock())
    with lock:
        data = r.get(key)  # double-check after acquiring lock
        if data: return json.loads(data)
        result = compute_fn()
        r.setex(key, ttl, json.dumps(result))
        return result`,
tip: `"Cache invalidation strategies?" — TTL (time-based, simplest), Event-based (delete on update — strong consistency), Versioned keys (user:1:v3 — old key naturally expires). "Cache stampede" mention karo — extra points.`

"HLD — Infrastructure_API Gateway": {
explain: `API Gateway = single entry point for all client requests. Functions: rate limiting, authentication (JWT verify), request routing (microservices mein), request/response transformation, logging, caching. AWS API Gateway ya Kong ya Nginx (basic). Monolith mein Django middleware yahi kaam karta hai. Microservices mein dedicated gateway zaroori hai.`,
example: `# ── Django as its own API Gateway ────────────
# Monolith mein middleware = API Gateway

# middleware.py
import jwt
from django.http import JsonResponse
from django.utils.deprecation import MiddlewareMixin

class AuthMiddleware(MiddlewareMixin):
    EXEMPT_PATHS = ["/api/auth/login/", "/api/auth/register/", "/health/"]

    def process_request(self, request):
        if request.path in self.EXEMPT_PATHS:
            return None

        token = request.META.get("HTTP_AUTHORIZATION", "").replace("Bearer ", "")
        if not token:
            return JsonResponse({"error": "Authentication required"}, status=401)
        try:
            payload = jwt.decode(token, settings.SECRET_KEY, algorithms=["HS256"])
            request.user_id  = payload["user_id"]
            request.tenant   = payload.get("tenant")
        except jwt.ExpiredSignatureError:
            return JsonResponse({"error": "Token expired"}, status=401)
        except jwt.InvalidTokenError:
            return JsonResponse({"error": "Invalid token"}, status=401)

class RateLimitMiddleware(MiddlewareMixin):
    def process_request(self, request):
        key   = f"ratelimit:{request.META.get('REMOTE_ADDR')}"
        count = r.incr(key)
        if count == 1:
            r.expire(key, 60)
        if count > 100:
            return JsonResponse({"error": "Rate limit exceeded"}, status=429)

class RequestLoggingMiddleware(MiddlewareMixin):
    def process_response(self, request, response):
        logger.info(f"{request.method} {request.path} → {response.status_code} "
                    f"user={getattr(request,'user_id','anon')}")
        return response

# settings.py

    "myapp.middleware.AuthMiddleware",
    "myapp.middleware.RateLimitMiddleware",
    "myapp.middleware.RequestLoggingMiddleware",
    ...
]

explain: `Event-driven architecture: services events publish karte hain, interested services consume karte hain — direct coupling nahi hoti. Event = "something happened" (OrderPlaced, PaymentReceived). Producer event publish karta hai aur forget karta hai. Multiple consumers independently react karte hain. Benefits: loose coupling, independent scaling, easy to add new consumers. Idempotency zaroori hai — same event do baar aaye toh duplicate side effects nahi hone chahiye.`,

@dataclass
class DomainEvent:
    event_id:   str
    event_type: str
    occurred_at: str
    payload:    dict

    @classmethod
    def create(cls, event_type: str, payload: dict) -> "DomainEvent":
        return cls(
            event_id    = str(uuid.uuid4()),
            event_type  = event_type,
            occurred_at = datetime.utcnow().isoformat(),

class BookingService:

        booking.status = "confirmed"
        booking.save()

            "booking_id": booking.id,
            "user_id":    booking.user_id,
            "room_id":    booking.room_id,
            "total":      str(booking.total),
        })

# ── Event Bus (Redis Streams) ─────────────────
class EventBus:
    _stream = "domain_events"

    @classmethod
    def publish(cls, event: DomainEvent):
        r.xadd(cls._stream, asdict(event))

    @classmethod
    def consume(cls, consumer_group: str, consumer_name: str):
        try:
            r.xgroup_create(cls._stream, consumer_group, id="0", mkstream=True)
        except redis.ResponseError:
            pass   # group already exists

        while True:
            messages = r.xreadgroup(consumer_group, consumer_name,
                                    {cls._stream: ">"}, count=10, block=1000)
            for _, msgs in (messages or []):
                for msg_id, data in msgs:
                    yield msg_id, data

# ── Consumers (independent services/workers) ──
class NotificationConsumer:
    def run(self):
        for msg_id, data in EventBus.consume("notifications", "worker-1"):
            if data["event_type"] == "booking.confirmed":
                booking_id = data["payload"]["booking_id"]
                self.send_notification(booking_id)
            r.xack("domain_events", "notifications", msg_id)  # acknowledge

        event_id   = event["event_id"]

            ProcessedEvent.objects.create(event_id=event_id)`,

"HLD — Infrastructure_Circuit breaker pattern": {
explain: `Circuit breaker = ek failing service pe repeated calls stop karta hai — cascade failures prevent karta hai. 3 states: Closed (normal — calls pass through), Open (service fail hai — calls blocked, fallback return), Half-Open (thodi calls allow — check if service recovered). Aapke SAP connector mein yeh zaroor hona chahiye — SAP down hone pe sab requests fail nahi honi chahiye.`,
example: `# ── Manual Circuit Breaker ────────────────────
import time
from enum import Enum
from threading import Lock

class CircuitState(Enum): CLOSED="closed"; OPEN="open"; HALF_OPEN="half_open"

class CircuitBreaker:
    def __init__(self, failure_threshold=5, recovery_timeout=60, half_open_calls=3):
        self.failure_threshold = failure_threshold
        self.recovery_timeout  = recovery_timeout
        self.half_open_calls   = half_open_calls

        self._state          = CircuitState.CLOSED
        self._failure_count  = 0
        self._last_failure   = None
        self._half_open_cnt  = 0
        self._lock           = Lock()

    def call(self, func, *args, **kwargs):
        with self._lock:
            if self._state == CircuitState.OPEN:
                if time.time() - self._last_failure > self.recovery_timeout:
                    self._state = CircuitState.HALF_OPEN
                    self._half_open_cnt = 0
                else:
                    raise CircuitOpenError("Circuit OPEN — service unavailable")

        try:
            result = func(*args, **kwargs)
            self._on_success()
            return result
        except Exception as exc:
            self._on_failure()
            raise

    def _on_success(self):
        with self._lock:
            if self._state == CircuitState.HALF_OPEN:
                self._half_open_cnt += 1
                if self._half_open_cnt >= self.half_open_calls:
                    self._state         = CircuitState.CLOSED
                    self._failure_count = 0
            elif self._state == CircuitState.CLOSED:
                self._failure_count = 0

    def _on_failure(self):
        with self._lock:
            self._failure_count += 1
            self._last_failure   = time.time()
            if self._failure_count >= self.failure_threshold:
                self._state = CircuitState.OPEN

# ── Usage with SAP Connector ──────────────────
sap_breaker = CircuitBreaker(failure_threshold=5, recovery_timeout=60)

def create_sap_order(order_id: int):
    try:
        return sap_breaker.call(SAPClient.create_order, order_id)
    except CircuitOpenError:
        # Fallback — queue for later sync
        PendingSAPSync.objects.create(order_id=order_id)
        logger.warning(f"SAP circuit open — order {order_id} queued")
        return {"status": "queued", "sap_order_id": None}
    except Exception as exc:
        logger.error(f"SAP call failed: {exc}")
        raise

# ── Using tenacity library (simpler) ─────────
from tenacity import (retry, stop_after_attempt,
                      wait_exponential, CircuitBreaker as TenacityBreaker)

@retry(
    stop=stop_after_attempt(3),
    wait=wait_exponential(multiplier=1, min=2, max=30),
    reraise=True,
)
def call_external_api(payload: dict):
    response = httpx.post(EXTERNAL_API_URL, json=payload, timeout=5.0)
    response.raise_for_status()
    return response.json()`,
tip: `"Circuit breaker vs Retry?" — Retry: same request dobara try karo (good for transient errors). Circuit breaker: agar service consistently fail ho rahi hai toh calls hi band karo — downstream protect karo. Dono sath use karo: retry inside circuit breaker.`

      {name:"ACID vs BASE",                         tag:"core",  imp:true,  note:"Django ORM=ACID, Celery async=BASE — your SAP sync!"},
      {name:"Latency vs throughput",                tag:"core",  imp:true,  note:"P99 latency, QPS — your 60% query reduction with indexes"},
      {name:"SLA / SLO / SLI",                     tag:"core",  imp:false, note:"99.9% uptime = 8.76 hrs downtime/year — error budget"},
      {name:"Back-of-envelope estimation",          tag:"core",  imp:true,  note:"Every interview starts here — QPS, storage, bandwidth"},
    ]
  },
  {
    section: "HLD — Infrastructure",
    badge: "Infra", tab: "infra",
    badgeColor: "#FAEEDA", badgeText: "#633806",
    concepts: [
      {name:"Load balancing",            tag:"infra", imp:true,  note:"Round robin, least conn, consistent hashing — AWS ALB/NLB"},
      {name:"Caching strategies",        tag:"infra", imp:true,  note:"Cache-aside, write-through, TTL — your Redis experience"},
      {name:"CDN",                       tag:"infra", imp:true,  note:"CloudFront + S3 — cache invalidation, presigned URLs"},
      {name:"DNS & reverse proxy",       tag:"infra", imp:false, note:"Nginx config, django-hosts for Niroskos subdomains"},
      {name:"API Gateway",               tag:"infra", imp:true,  note:"Rate limiting, auth, routing — Django middleware = gateway"},
      {name:"Message queues",            tag:"infra", imp:true,  note:"Celery+Redis/RabbitMQ — work queue vs pub-sub, DLQ"},
      {name:"Service mesh",              tag:"infra", imp:false, note:"Istio, Envoy sidecar — for 10+ microservices scale"},
      {name:"Event-driven architecture", tag:"infra", imp:true,  note:"Domain events, Redis Streams, idempotency — loose coupling"},
      {name:"Circuit breaker pattern",   tag:"infra", imp:true,  note:"Prevent cascade failures — SAP connector fallback!"},
    ]
  }
];

/* ════════════════════════════════
   STATE & RENDER
════════════════════════════════ */
const state = JSON.parse(localStorage.getItem("hld_fi_v1") || "{}");
let currentTab = "all";

function save() { localStorage.setItem("hld_fi_v1", JSON.stringify(state)); }

function toggleDone(evt, key) {
  evt.stopPropagation();
  state[key] = !state[key];
  save(); render();
}

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  ["all","fundamentals","infra","pending"].forEach((t, i) => {
    if (t === tab) document.querySelectorAll(".tab-btn")[i].classList.add("active");
  });
  render();
}

function toggleDetail(evt, id) {
  evt.stopPropagation();
  const panel = document.getElementById(id);
  const btn   = evt.currentTarget;
  if (!panel) return;
  const open = panel.style.display !== "none";
  panel.style.display = open ? "none" : "block";
  btn.textContent     = open ? "Details ▼" : "Details ▲";
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function makeId(sec, name) {
  return "d_" + (sec + "_" + name).replace(/[^a-zA-Z0-9]/g, "_");
}

function getDetail(sec, name) {
  const d = details[sec + "_" + name];
  if (!d) return '<p style="font-size:11px;color:#999;padding:8px">Coming soon...</p>';
  return `
    <div class="det-explain">${d.explain}</div>
    <div class="det-label">Python / Django Code Example</div>
    <pre class="det-code">${escHtml(d.example)}</pre>
    <div class="det-tip">${d.tip}</div>`;
}

function render() {
  const container = document.getElementById("container");
  container.innerHTML = "";
  let total = 0, done = 0;

  data.forEach(sec => {
    const concepts = sec.concepts.filter(c => {
      if (currentTab === "fundamentals" && sec.tab !== "fundamentals") return false;
      if (currentTab === "infra"        && sec.tab !== "infra")        return false;
      if (currentTab === "pending" && state[sec.section + "_" + c.name]) return false;
      return true;
    });
    if (!concepts.length) return;

    total += sec.concepts.length;
    sec.concepts.forEach(c => { if (state[sec.section + "_" + c.name]) done++; });

    const doneCount = sec.concepts.filter(c => state[sec.section + "_" + c.name]).length;
    const el = document.createElement("div");
    el.className = "section";
    el.innerHTML = `
      <div class="sec-header">
        <span class="sec-badge" style="background:${sec.badgeColor};color:${sec.badgeText}">${sec.badge}</span>
        <span class="sec-title">${sec.section}</span>
        <span class="sec-count">${doneCount}/${sec.concepts.length} done</span>
      </div>
      <div class="grid">${concepts.map(c => {
        const sk  = sec.section + "_" + c.name;
        const did = makeId(sec.section, c.name);
        const isDone = !!state[sk];
        return `
        <div class="concept-card${c.imp?" imp":""}${isDone?" done":""}">
          <div class="c-top" onclick="toggleDone(event,'${sk.replace(/'/g,"\\'")}')">
            <div class="c-name">${c.name}</div>
            <div class="c-check">
              <svg class="checkmark" viewBox="0 0 10 10" fill="none">
                <polyline points="1.5,5 4,7.5 8.5,2.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
          <span class="c-tag">${c.tag}</span>
          <div class="c-note">${c.note}</div>
          <button class="det-btn" onclick="toggleDetail(event,'${did}')">Details ▼</button>
          <div class="det-panel" id="${did}">${getDetail(sec.section, c.name)}</div>
        </div>`;
      }).join("")}</div>`;
    container.appendChild(el);
  });

  const fill = total ? Math.round(done/total*100) : 0;
  document.getElementById("prog-fill").style.width  = fill + "%";
  document.getElementById("prog-label").textContent = done + " / " + total;
}

render();
</script>
