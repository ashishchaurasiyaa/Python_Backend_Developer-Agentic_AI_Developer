# Celery lab stack — Redis (broker + result backend) + Flower UI
# Start:  docker compose up -d
# Flower: http://localhost:5555   (tasks, workers, queues live dekho)
# Stop:   docker compose down -v
services:
  redis:
    image: redis:7-alpine
    container_name: celery-lab-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional UI — worker/task inspection ke liye bahut useful
  # Worker tumhare host pe chalega (labs me), Flower usi Redis ko dekhega
  flower:
    image: mher/flower:2.0
    container_name: celery-lab-flower
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5555:5555"
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]
