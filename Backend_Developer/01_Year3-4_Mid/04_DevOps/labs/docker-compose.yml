# DevOps labs shared stack — Lab 02 (nginx + backend) and Lab 03 (prometheus + metrics-app).
# Labs 01 and 04 manage their own containers via subprocess (they test the
# build/health-gate PROCESS itself, not a static stack) — they don't use this file.
#
# Bring up only what a given lab needs:
#   docker compose up -d nginx backend            # Lab 02
#   docker compose up -d prometheus metrics-app   # Lab 03
# Stop everything:
#   docker compose down -v
services:
  # ── Lab 02 ────────────────────────────────────────────────────────────
  backend:
    image: python:3.12-slim
    container_name: devops-lab-backend
    working_dir: /app
    volumes:
      - ./app/backend_app.py:/app/backend_app.py:ro
    command: ["python", "backend_app.py"]
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: devops-lab-nginx
    depends_on:
      - backend
    volumes:
      - ./configs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "18010:80"

  # ── Lab 03 ────────────────────────────────────────────────────────────
  metrics-app:
    build:
      context: ./app
      dockerfile: Dockerfile.metrics
    container_name: devops-lab-metrics-app
    ports:
      - "19091:8000"

  prometheus:
    image: prom/prometheus:latest
    container_name: devops-lab-prometheus
    depends_on:
      - metrics-app
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "19090:9090"
