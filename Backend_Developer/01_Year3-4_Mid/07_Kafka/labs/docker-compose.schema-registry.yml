# Schema Registry overlay — Lab 06 ke liye
#
# Start:  docker compose -f docker-compose.yml -f docker-compose.schema-registry.yml up -d
# Check:  curl http://localhost:8081/subjects        → []  (khaali list = registry zinda hai)
# Stop:   docker compose -f docker-compose.yml -f docker-compose.schema-registry.yml down -v
#
# ─────────────────────────────────────────────────────────────────────────────
# YEH OVERLAY BROKER KE LISTENERS BHI THEEK KARTA HAI — kyun samajhna zaroori hai:
#
# Base compose me broker sirf `PLAINTEXT://localhost:9092` advertise karta hai.
# Advertised listener wo address hai jo broker CLIENT ko batata hai: "mujhse yahan
# baat karo". Host machine se chalao to sahi hai — localhost:9092 tumhara machine hai.
#
# Par jo client DOCKER NETWORK ke ANDAR hai (Schema Registry, kafka-ui), uske liye
# "localhost" ka matlab USKA APNA container hai, broker nahi. Wo bootstrap to
# kafka:9092 pe kar lega, phir broker metadata me "localhost:9092" bhej dega,
# aur client apne hi andar connect karne lagega → connection refused / hang.
# (Yahi wajah hai ki base stack me kafka-ui aksar "offline" dikhata hai.)
#
# Fix = DO listeners: ek internal (container-to-container), ek host ke liye.
#   PLAINTEXT      → kafka:29092   (docker network ke andar wale clients)
#   PLAINTEXT_HOST → localhost:9092 (tumhare laptop se chalne wale scripts)
#
# Interview me yeh poocha jata hai: "Kafka docker me kyun connect nahi hota?"
# Jawab yahi hai — advertised.listeners, bootstrap address nahi.
# ─────────────────────────────────────────────────────────────────────────────

services:
  kafka:
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Internal clients ab kafka:29092 use karenge
  kafka-ui:
    environment:
      KAFKA_CLUSTERS_0_NAME: lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: schema-registry-lab
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # Registry apne schemas ek Kafka topic (_schemas) me hi store karta hai —
      # yahi "Kafka is the database" wala design hai. Isliye replication factor 1.
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      # Default compatibility. Lab me isse PUT /config se badal ke dekhoge.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
