# TEMPLATE — copy to secret.yaml, fill real values, and NEVER commit secret.yaml.
# secret.yaml is already covered by this repo's top-level .gitignore pattern
# for *secret*.yaml; double-check before committing regardless.
#
# Real deployments: don't even use `kubectl apply -f secret.yaml` — use
# External Secrets Operator or Sealed Secrets pulling from AWS Secrets
# Manager / Parameter Store instead, so no plaintext secret ever touches disk
# or Git history, encrypted or not.
apiVersion: v1
kind: Secret
metadata:
  name: rag-backend-secrets
  labels:
    app: rag-backend
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://rag:CHANGE-ME@CHANGE-ME-rds-endpoint:5432/ragdb"
  REDIS_URL: "redis://CHANGE-ME-redis-endpoint:6379/0"
  JWT_SECRET: "CHANGE-ME-generate-with-openssl-rand-base64-32"
  OPENAI_API_KEY: "CHANGE-ME"
  ANTHROPIC_API_KEY: "CHANGE-ME"
  COHERE_API_KEY: "CHANGE-ME"
