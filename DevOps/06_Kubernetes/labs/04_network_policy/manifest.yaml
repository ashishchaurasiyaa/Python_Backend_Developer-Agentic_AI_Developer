# TODO lab: Kubernetes networking is FLAT by default — every Pod can reach
# every other Pod's IP across the whole cluster, no matter the namespace,
# unless a NetworkPolicy says otherwise. This is one of the most-cited
# "surprising by default" facts about Kubernetes, and the one thing this
# repo's OWN existing self-check checklist (../../practical/01_kubernetes_lab.md,
# bottom) asks about but never actually builds hands-on. This lab builds it.
#
# NOTE: this only enforces anything because the lab cluster runs Calico as
# its CNI instead of kind's default kindnet (see ../_setup/setup.sh) —
# kindnet silently accepts NetworkPolicy objects and does nothing with them.
# If you ever see a NetworkPolicy that "isn't working" in a real cluster,
# checking whether the CNI plugin enforces NetworkPolicy at all is the FIRST
# thing to check, before assuming your YAML is wrong.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8s-labs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: k8s-labs
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
# YOUR TASK: this NetworkPolicy currently has an EMPTY ingress list, which
# combined with policyTypes: [Ingress] means "deny ALL ingress traffic to
# app=web pods" — no exceptions, not even from pods that should legitimately
# be allowed. Add an `ingress:` rule that allows traffic ONLY from Pods
# labeled `role: allowed` (leave everyone else denied):
#
#   ingress:
#     - from:
#         - podSelector:
#             matchLabels:
#               role: allowed
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-netpol
  namespace: k8s-labs
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Ingress
  ingress: []  # TODO: add a rule allowing only Pods labeled role=allowed
