# TODO lab: a ConfigMap value delivered as an ENV VAR and the SAME value
# delivered as a MOUNTED FILE behave completely differently when the
# ConfigMap changes later, while the Pod keeps running:
#   - the mounted FILE updates on its own (kubelet re-syncs it, usually
#     within about a minute — no Pod restart, no re-apply of anything)
#   - the ENV VAR never updates, ever, without a Pod restart — env vars are
#     injected once, at container start, and never revisited
#
# This is one of the most common "why didn't my config change take effect"
# production incidents, and the most common wrong answer to it in interviews
# ("just wait, it'll pick it up" — true for the file, false for the env var).
#
# YOUR TASK: this Pod currently reads MESSAGE only as an env var. Add a
# volumeMount so the SAME ConfigMap is ALSO available as a file at
# /etc/config/MESSAGE:
#   1. add a `volumes:` entry named "config-vol" of type `configMap`,
#      referencing configMapName `app-config`
#   2. add a `volumeMounts:` entry on the container mounting "config-vol" at
#      /etc/config
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: k8s-labs
data:
  MESSAGE: v1
---
apiVersion: v1
kind: Pod
metadata:
  name: config-test
  namespace: k8s-labs
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      env:
        - name: MESSAGE_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MESSAGE
      # TODO: add volumeMounts here (mount "config-vol" at /etc/config)
  # TODO: add volumes here (a configMap volume named "config-vol" backed by app-config)
